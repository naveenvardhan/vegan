services:
  db:
    image: postgres:15-alpine
    container_name: vegan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vegan_production
      POSTGRES_USER: vegan_user
      POSTGRES_PASSWORD: mP77JnBNLmjCRb67ffEKHk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegan_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegan_network

  redis:
    image: redis:7-alpine
    container_name: vegan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vegan_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vegan_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://vegan_user:${DB_PASSWORD}@db:5432/vegan_production
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "enabled"
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      MALLOC_ARENA_MAX: 2
      RAILS_ASSET_HOST: ""
    volumes:
      - storage_data:/app/storage
      - ./log:/app/log
    ports:
      - "3000:3000"
    networks:
      - vegan_network
    command: >
      bash -c "bundle exec rails db:prepare &&
               bundle exec rails assets:precompile &&
               bundle exec puma -C config/puma.rb"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  vegan_network:
    driver: bridge
